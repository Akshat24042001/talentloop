# One-click deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# PUBLIC_URL is filled automatically from RENDER_EXTERNAL_URL.
services:
  - type: web
    name: talentloop-ai-interview
    runtime: docker
    # Keep the server next to the database: the region nearest your Supabase project (DEPLOY.md, Step 1).
    # Fixed when the service is created.
    region: singapore
    # Free plan: no persistent disk, so interviews are wiped when the service restarts or sleeps
    # (after 15 min idle). For real candidates switch to "starter" and uncomment the disk block.
    plan: free
    healthCheckPath: /api/health
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 5
    envVars:
      - key: DATA_DIR
        value: /data
      - key: DATABASE_URL     # Supabase Session pooler URI (DEPLOY.md step 3). Without it, accounts and jobs are wiped on restart
        sync: false
      - key: PLATFORM_ADMIN_EMAILS   # your email: sign up with it to get the Platform admin console
        sync: false
      - key: VAPI_PUBLIC_KEY
        sync: false
      - key: LLM_API_KEY      # OpenRouter key (sk-or-...) uses free models automatically; an OpenAI key uses GPT-4.1
        sync: false
      - key: LLM_MOCK
        value: "0"
      # Resumes and recordings: Supabase Storage's S3 endpoint (or Backblaze B2), see DEPLOY.md.
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION        # Supabase: your project region, e.g. ap-south-1
        sync: false
      - key: RECONNECT_WINDOW_SEC
        value: "30"
