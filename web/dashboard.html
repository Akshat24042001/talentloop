<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interviews · TalentLoop</title>
<link rel="stylesheet" href="/style.css">
<style>
  .filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin-bottom:12px}
  @media (max-width:860px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}
  .cand b{display:block} .cand span{font-size:12.5px;color:var(--muted)}
  .score{display:flex;align-items:center;gap:8px;font-weight:700;font-variant-numeric:tabular-nums}
  .score .mini{width:54px;height:6px;border-radius:0 3px 3px 0;background:var(--track);position:relative}
  .score .mini i{position:absolute;left:0;top:0;bottom:0;border-radius:0 3px 3px 0;background:var(--series-1)}
  tr.rowlink{cursor:pointer} tr.rowlink:hover td{background:var(--line2)}
  .charts2{display:grid;grid-template-columns:1fr 1fr;gap:16px} @media (max-width:760px){.charts2{grid-template-columns:1fr}}
  .empty{text-align:center;padding:36px 12px}
  .empty svg{color:var(--brand)}
  @media (max-width:700px){ .hide-sm{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div><h1>Interviews</h1><p class="sub" style="margin:0">Every AI interview you've sent, with results and integrity at a glance.</p></div>
    <div class="actions" style="margin:0"><a class="btn" id="csvBtn"></a><a class="btn primary" href="/hr.html" id="newBtn"></a></div>
  </div>
  <div id="health" class="small muted" style="margin:-6px 0 14px"></div>
  <div class="stats" id="stats"></div>
  <div class="charts2">
    <div class="card"><h3>AI recommendations</h3><div id="recChart"></div></div>
    <div class="card"><h3>Integrity risk</h3><div id="riskChart"></div></div>
  </div>
  <div class="card">
    <div class="filters">
      <input class="search" id="q" placeholder="Search candidate, role, company or email" type="search">
      <select id="fStatus"><option value="">All statuses</option></select>
      <select id="fRole"><option value="">All roles</option></select>
      <select id="fRisk"><option value="">Any integrity</option><option value="high">High risk</option><option value="medium">Medium risk</option><option value="low">Low risk</option><option value="dq">Disqualified</option></select>
      <select id="sortBy"><option value="new">Newest first</option><option value="score">Best AI score</option><option value="risk">Highest risk</option><option value="name">Name A-Z</option></select>
    </div>
    <div id="calib" class="small muted" style="margin-bottom:8px"></div>
    <div id="list" class="small muted">Loading...</div>
  </div>
</div>
<script src="/common.js"></script>
<script src="/charts.js"></script>
<script>
renderNav('dashboard');
$('csvBtn').innerHTML = icon('download', 17) + 'Export CSV';
$('newBtn').innerHTML = icon('plus', 17) + 'New interview';
Object.entries(STATUS_LABEL).forEach(([k, v]) => $('fStatus').insertAdjacentHTML('beforeend', `<option value="${k}">${esc(v)}</option>`));
let ROWS = [], PUBLIC_BASE = location.origin;

async function init(){
  try{
    const h = await api('/api/health');
    if (h.public_url) PUBLIC_BASE = h.public_url.replace(/\/$/, '');
    const bad = [];
    if (!h.mock && !h.llm_key_set) bad.push('LLM_API_KEY missing');
    if (!h.public_url) bad.push('PUBLIC_URL not set: Vapi cannot reach this server');
    if (!h.vapi_key_set) bad.push('VAPI_PUBLIC_KEY missing');
    if (!h.storage.s3 && !h.storage.persistent_disk) bad.push('Storage is temporary: a restart wipes interviews (set S3_*, see DEPLOY.md)');
    if (h.admin_weak) bad.push('ADMIN_KEY empty or weak');
    $('health').innerHTML = (h.mock ? '<span class="chip warn">Demo mode: fake AI (LLM_MOCK=1)</span> ' : '') +
      bad.map(b => `<span class="chip bad">${icon('alert', 13)} ${esc(b)}</span>`).join(' ');
  }catch(e){ $('health').innerHTML = `<span class="chip bad">Server not reachable: ${esc(e.message)}</span>`; }
  await loadList();
}

async function loadList(){
  try{
    const [rows, cal] = await Promise.all([api('/api/interviews'), api('/api/calibration')]);
    ROWS = rows;
    $('calib').innerHTML = cal.pairs ? `AI vs HR agreement: AI within ±1 of your score on <b>${cal.within_1}%</b> of ${cal.pairs} scored answers · exact ${cal.exact}% · AI minus HR ${cal.ai_minus_hr_avg}` : 'Tip: enter your own scores on a report page to measure how closely the AI agrees with your team.';
    $('csvBtn').href = withKey('/api/interviews.csv');
    const roles = [...new Set(rows.map(r => r.role).filter(Boolean))].sort();
    $('fRole').innerHTML = '<option value="">All roles</option>' + roles.map(r => `<option>${esc(r)}</option>`).join('');
    renderStats(); renderList();
  }catch(e){ $('list').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

function renderStats(){
  const n = s => ROWS.filter(r => r.status === s).length;
  const done = ROWS.filter(r => ['completed', 'scored', 'incomplete'].includes(r.status)).length;
  const scores = ROWS.map(r => r.overall).filter(x => typeof x === 'number');
  const avg = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : '-';
  const tiles = [
    ['Total sent', ROWS.length, `${n('created')} not started yet`],
    ['Completed', done, `${n('in_progress')} in progress now`],
    ['Average AI score', avg, scores.length ? `out of 5, across ${scores.length}` : 'no scored interviews yet'],
    ['Recommended', ROWS.filter(r => ['yes', 'strong_yes'].includes(r.recommendation)).length, 'AI says yes or strong yes'],
    ['High integrity risk', ROWS.filter(r => r.risk === 'high').length, 'review the recording'],
    ['Disqualified', ROWS.filter(r => r.disqualified).length, 'left after final warning'],
  ];
  $('stats').innerHTML = tiles.map(([k, v, d]) => `<div class="stat"><div class="k">${k}</div><div class="v">${esc(v)}</div><div class="d">${esc(d)}</div></div>`).join('');
  const c = k => ROWS.filter(r => r.recommendation === k).length;
  $('recChart').innerHTML = splitBar([{label: 'Strong yes', n: c('strong_yes'), cls: 'c-sy'}, {label: 'Yes', n: c('yes'), cls: 'c-y'},
    {label: 'Maybe', n: c('maybe'), cls: 'c-m'}, {label: 'No', n: c('no'), cls: 'c-n'}]);
  const r = k => ROWS.filter(x => x.risk === k).length;
  $('riskChart').innerHTML = splitBar([{label: 'Low', n: r('low'), cls: 'c-low'}, {label: 'Medium', n: r('medium'), cls: 'c-med'}, {label: 'High', n: r('high'), cls: 'c-high'}]);
}

function renderList(){
  const q = $('q').value.toLowerCase().trim(), fs = $('fStatus').value, fr = $('fRisk').value, role = $('fRole').value, sort = $('sortBy').value;
  const rank = {high: 3, medium: 2, low: 1};
  let rows = ROWS.filter(r => (!fs || r.status === fs) && (!role || r.role === role) &&
    (!fr || (fr === 'dq' ? r.disqualified : r.risk === fr)) &&
    (!q || [r.candidate, r.role, r.company, r.email].join(' ').toLowerCase().includes(q)));
  if (sort === 'score') rows.sort((a, b) => (b.overall ?? -1) - (a.overall ?? -1));
  if (sort === 'risk') rows.sort((a, b) => (b.disqualified - a.disqualified) || (rank[b.risk] || 0) - (rank[a.risk] || 0));
  if (sort === 'name') rows.sort((a, b) => String(a.candidate || '').localeCompare(String(b.candidate || '')));
  if (!rows.length){
    $('list').innerHTML = ROWS.length ? '<p class="muted">No interviews match the filters.</p>'
      : `<div class="empty">${icon('sparkle', 34)}<h3 style="margin-top:8px">No interviews yet</h3><p class="muted">Create your first AI interview. Sample roles are ready to try.</p><a class="btn primary" href="/hr.html">${icon('plus', 17)}New interview</a></div>`;
    return;
  }
  $('list').innerHTML = `<div class="table-wrap"><table><thead><tr><th>Candidate</th><th class="hide-sm">Role</th><th>Status</th><th>AI verdict</th><th>Score</th><th>Integrity</th><th class="hide-sm">HR</th><th class="hide-sm">Created</th><th></th></tr></thead><tbody>` +
    rows.map(r => `<tr class="rowlink" data-id="${esc(r.id)}">
      <td class="cand"><b>${esc(r.candidate || 'Candidate')}</b><span>${esc(r.email || '')}</span></td>
      <td class="hide-sm">${esc(r.role || '')}<div class="small muted">${esc(r.company || '')}</div></td>
      <td><span class="chip ${STATUS_CLASS[r.status] || ''}">${esc(STATUS_LABEL[r.status] || r.status)}</span></td>
      <td>${r.recommendation ? `<span class="chip ${REC_CLASS[r.recommendation] || ''}">${esc(REC_LABEL[r.recommendation])}</span>` : '<span class="muted">-</span>'}</td>
      <td>${typeof r.overall === 'number' ? `<span class="score">${r.overall.toFixed(1)}<span class="mini"><i style="width:${r.overall / 5 * 100}%"></i></span></span>` : '<span class="muted">-</span>'}</td>
      <td>${r.disqualified ? `<span class="chip bad">${icon('alert', 12)} Disqualified</span>` : r.risk ? `<span class="chip ${r.risk === 'high' ? 'bad' : r.risk === 'medium' ? 'warn' : 'ok'}">${esc(r.risk[0].toUpperCase() + r.risk.slice(1))}</span>` : '<span class="muted">-</span>'}
        ${r.warnings && !r.disqualified ? `<div class="small warn">${r.warnings} warning${r.warnings > 1 ? 's' : ''}</div>` : ''}</td>
      <td class="hide-sm">${esc((r.decision || '').replace('_', ' ')) || '<span class="muted">-</span>'}</td>
      <td class="hide-sm small muted" title="${esc(when(r.created_at))}">${esc(ago(r.created_at))}</td>
      <td style="white-space:nowrap"><a class="btn sm" href="/report.html?id=${encodeURIComponent(r.id)}">Report</a>
        <button class="sm ghost" data-copy="${esc(r.id)}" title="Copy candidate link" aria-label="Copy candidate link">${icon('link', 16)}</button></td></tr>`).join('') + '</tbody></table></div>';
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = e => { e.stopPropagation(); copyText(`${PUBLIC_BASE}/interview.html?id=${b.dataset.copy}`, 'Candidate link copied'); });
  document.querySelectorAll('tr.rowlink').forEach(tr => tr.onclick = e => { if (!e.target.closest('a,button')) location.href = `/report.html?id=${encodeURIComponent(tr.dataset.id)}`; });
}
['q', 'fStatus', 'fRisk', 'fRole', 'sortBy'].forEach(id => $(id).addEventListener('input', renderList));
init();
setInterval(() => { if (!document.hidden) loadList(); }, 30000);
</script>
</body>
</html>
